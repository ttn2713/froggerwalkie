<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐈‍⬛ black cat crossing · slow &amp; simple</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #1f3b1f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 12px;
        }
        /* ultra-flat container – no nested borders, minimal chrome */
        .game-area {
            background: #1f3b1f;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            max-width: 680px;
            width: 100%;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            background: #2a6b2a;
            width: 100%;
            height: auto;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            cursor: crosshair;
            touch-action: none;
        }
        /* single flat row for score + buttons */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding: 0 4px;
            color: #e9f5d0;
            font-weight: bold;
            font-size: 1.3rem;
            text-shadow: 2px 2px 0 #0a1f0a;
        }
        .score {
            background: #0d2b0d;
            padding: 4px 18px;
            border-radius: 40px;
            letter-spacing: 1px;
            box-shadow: inset 0 -2px 0 #4a7a4a;
            white-space: nowrap;
        }
        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .restart,
        .sound {
            background: #e7b42e;
            border: none;
            font-size: 1.3rem;
            padding: 4px 18px 6px;
            border-radius: 40px;
            font-weight: 800;
            color: #1e2a0e;
            box-shadow: 0 4px 0 #8f6f1a;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.05s linear;
            transform: translateY(-1px);
            line-height: 1;
        }
        .sound {
            width: 46px;
            height: 42px;
            padding: 0;
            background: #f4d06f;
            font-size: 1.25rem;
        }
        .restart:active,
        .sound:active {
            box-shadow: 0 1px 0 #8f6f1a;
            transform: translateY(3px);
        }
        .restart:focus-visible,
        .sound:focus-visible {
            outline: 3px solid #fff3b0;
            outline-offset: 2px;
        }
        .hint {
            text-align: center;
            margin-top: 8px;
            color: #b8d9a4;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        @media (max-width: 420px) {
            .top-bar { font-size: 1.05rem; }
            .restart { font-size: 1.05rem; padding: 4px 12px 6px; }
            .sound { width: 40px; height: 38px; }
            .hint { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="game-area">
    <!-- single row – no nested divs beyond this -->
    <div class="top-bar">
        <span class="score">🏆 <span id="scoreDisplay">0</span></span>
        <div class="top-actions">
            <button class="sound" id="soundButton" type="button" aria-label="Mute sound" title="Sound on / off">🔊</button>
            <button class="restart" id="restartButton" type="button">↻ RESTART</button>
        </div>
    </div>
    <canvas id="gameCanvas" width="640" height="480"></canvas>
    <div class="hint">🐈‍⬛ arrow keys / swipe · hop across · reach 🏁</div>
</div>
<script>
    (function() {
        'use strict';

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const soundButton = document.getElementById('soundButton');

        // ---------- grid ----------
        const COLS = 8;
        const ROWS = 9;
        const CELL_W = canvas.width / COLS;   // 80
        const CELL_H = canvas.height / ROWS;  // 53.333

        // ---------- car constants ----------
        // Centre-to-centre spacing, measured in columns. Cars are drawn at
        // roughly 0.8 columns wide, so this leaves a real gap between them.
        const MIN_CAR_GAP = 1.18;
        // Every car gets its own base speed from this list. None are equal,
        // so the traffic always feels varied without ever piling up.
        const CAR_SPEEDS = [
            0.0096, 0.0107, 0.0118, 0.0129,
            0.0140, 0.0151, 0.0162, 0.0173,
            0.0102, 0.0113, 0.0124, 0.0135,
            0.0146
        ];
        const carEmojis = ['🚗', '🚙', '🚕', '🚌', '🚚', '🚓'];

        // ---------- state ----------
        let score = 0;
        let cat = {
            col: 3,
            row: 0,
            facing: 1,
            hopStart: -9999,
            invulnerableUntil: 0
        };
        let cars = [];
        let lastFrameTime = 0;

        // ---------- cute sound effects (Web Audio, no files needed) ----------
        const Sound = (() => {
            let audioCtx = null;
            let masterGain = null;
            let enabled = true;

            function init() {
                if (!enabled) return null;
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContextClass) return null;
                    audioCtx = new AudioContextClass();
                    masterGain = audioCtx.createGain();
                    masterGain.gain.value = 0.42;
                    masterGain.connect(audioCtx.destination);
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
                return audioCtx;
            }

            function tone(startFreq, endFreq, duration, type, volume, delay) {
                const ac = init();
                if (!ac || !masterGain) return;

                const start = ac.currentTime + (delay || 0);
                const osc = ac.createOscillator();
                const gain = ac.createGain();

                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(Math.max(40, startFreq), start);
                if (endFreq && endFreq !== startFreq) {
                    osc.frequency.exponentialRampToValueAtTime(
                        Math.max(40, endFreq),
                        start + duration
                    );
                }

                const peak = volume == null ? 0.12 : volume;
                gain.gain.setValueAtTime(0.0001, start);
                gain.gain.linearRampToValueAtTime(peak, start + 0.012);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

                osc.connect(gain);
                gain.connect(masterGain);
                osc.start(start);
                osc.stop(start + duration + 0.03);
            }

            function jump() {
                // A soft, springy "boing" – friendly rather than arcade-loud.
                tone(520, 940, 0.12, 'sine', 0.11);
                tone(880, 1320, 0.09, 'triangle', 0.045, 0.028);
            }

            function win() {
                // A tiny sparkly four-note fanfare.
                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((freq, i) => {
                    tone(freq, freq * 1.01, 0.20, 'triangle', 0.09, i * 0.09);
                    tone(freq * 2, freq * 2, 0.12, 'sine', 0.025, i * 0.09 + 0.015);
                });
            }

            function hit() {
                // Gentle descending "uh-oh", never harsh or scary.
                tone(430, 250, 0.22, 'sine', 0.10);
                tone(300, 210, 0.28, 'triangle', 0.045, 0.10);
            }

            function click() {
                tone(660, 880, 0.08, 'sine', 0.07);
            }

            function unlock() {
                init();
            }

            function setEnabled(nextEnabled) {
                enabled = nextEnabled;
                if (masterGain) {
                    masterGain.gain.setTargetAtTime(
                        enabled ? 0.42 : 0.0001,
                        audioCtx.currentTime,
                        0.02
                    );
                }
                if (enabled) init();
            }

            return {
                jump,
                win,
                hit,
                click,
                unlock,
                setEnabled,
                isEnabled: () => enabled
            };
        })();

        // ---------- initialize cars ----------
        function resetCars() {
            cars = [];
            const roadRows = [2, 3, 4, 5, 6];
            const shuffledSpeeds = CAR_SPEEDS.slice().sort(() => Math.random() - 0.5);
            let speedIndex = 0;

            roadRows.forEach(row => {
                // 2 or 3 cars per row
                const carCount = (row % 2 === 0) ? 3 : 2;
                // alternate direction per row
                const dir = (row % 2 === 0) ? 1 : -1;
                // Even spacing leaves plenty of room at the start; the
                // follow logic below keeps that spacing at all times.
                const spacing = COLS / carCount;
                const offset = Math.random() * spacing;

                for (let i = 0; i < carCount; i++) {
                    cars.push({
                        fCol: wrapCol(offset + i * spacing),
                        row: row,
                        dir: dir,
                        emoji: carEmojis[Math.floor(Math.random() * carEmojis.length)],
                        speed: shuffledSpeeds[speedIndex++],
                        moveStep: 0
                    });
                }
            });
        }

        function wrapCol(value) {
            return ((value % COLS) + COLS) % COLS;
        }

        // ---------- reset game (score + cat + cars) ----------
        function resetGame() {
            cat = {
                col: 3,
                row: 0,
                facing: 1,
                hopStart: -9999,
                invulnerableUntil: 0
            };
            score = 0;
            updateScore();
            resetCars();
        }

        function updateScore() {
            scoreSpan.textContent = score;
        }

        // ---------- collision: cat vs any car ----------
        // Compare centres on the wrapping road, with a slightly forgiving
        // hitbox so children are not caught by an empty pixel.
        function checkCollision() {
            const catCentre = cat.col + 0.5;

            for (const car of cars) {
                if (car.row !== cat.row) continue;

                let dx = Math.abs(car.fCol + 0.5 - catCentre);
                dx = Math.min(dx, COLS - dx);

                if (dx < 0.60) return true;
            }
            return false;
        }

        // ---------- move cat ----------
        function moveCat(direction) {
            let newCol = cat.col;
            let newRow = cat.row;

            if (direction === 'up') newRow = Math.min(cat.row + 1, ROWS - 1);
            if (direction === 'down') newRow = Math.max(cat.row - 1, 0);
            if (direction === 'left') newCol = Math.max(cat.col - 1, 0);
            if (direction === 'right') newCol = Math.min(cat.col + 1, COLS - 1);

            if (direction === 'left') cat.facing = -1;
            if (direction === 'right') cat.facing = 1;

            if (newCol === cat.col && newRow === cat.row) return;

            const oldCol = cat.col;
            const oldRow = cat.row;
            cat.col = newCol;
            cat.row = newRow;

            // Immediate collision check after tentative move
            if (checkCollision()) {
                cat.col = oldCol;
                cat.row = oldRow;
                return;
            }

            // Successful hop feedback
            cat.hopStart = performance.now();
            Sound.jump();

            // Win condition: reach top row (row 8)
            if (cat.row === ROWS - 1) {
                score++;
                updateScore();
                Sound.win();

                // Respawn at the start. Cars keep flowing – no sudden
                // disappearing traffic after a win or a bump.
                cat.col = 3;
                cat.row = 0;
                cat.facing = 1;
                cat.hopStart = -9999;
                cat.invulnerableUntil = performance.now() + 500;
            }
        }

        // ---------- update car positions ----------
        // Cars in one lane may have different base speeds. The car behind is
        // allowed to close the gap, but never to move closer than
        // MIN_CAR_GAP. Because all moves are calculated from the same
        // snapshot, the gap can only grow, so overlap is impossible.
        function updateCars(dt) {
            const lanes = new Map();

            for (const car of cars) {
                if (!lanes.has(car.row)) lanes.set(car.row, []);
                lanes.get(car.row).push(car);
            }

            lanes.forEach(laneCars => {
                const count = laneCars.length;

                const progress = car => {
                    let p = (car.dir === 1 ? car.fCol : COLS - car.fCol) % COLS;
                    return (p + COLS) % COLS;
                };

                laneCars.forEach(car => { car._p = progress(car); });

                const sorted = laneCars.slice().sort((a, b) => a._p - b._p);

                for (let i = 0; i < count; i++) {
                    const car = sorted[i];
                    const nextCar = sorted[(i + 1) % count];

                    let gap = nextCar._p - car._p;
                    if (gap <= 0) gap += COLS;

                    const room = Math.max(0, gap - MIN_CAR_GAP);
                    const wanted = car.speed * dt;
                    car.moveStep = Math.min(wanted, room);
                }

                laneCars.forEach(car => {
                    car.fCol = wrapCol(car.fCol + car.dir * car.moveStep);
                });
            });
        }

        // ---------- collision after car movement ----------
        function checkCollisionAfterMove(now) {
            if (now < cat.invulnerableUntil) return;

            if (checkCollision()) {
                Sound.hit();
                cat.col = 3;
                cat.row = 0;
                cat.facing = 1;
                cat.hopStart = -9999;
                // A short grace period avoids a second, frustrating bump on
                // the very next frame. Traffic itself keeps moving.
                cat.invulnerableUntil = now + 700;
            }
        }

        // ---------- draw background ----------
        function drawBackground() {
            for (let row = 0; row < ROWS; row++) {
                const y = canvas.height - (row + 1) * CELL_H;
                let fillColor = '#2e7d32';

                if (row === 0) fillColor = '#4caf50';        // start grass
                else if (row === 1) fillColor = '#388e3c';   // safe grass
                else if (row >= 2 && row <= 6) fillColor = '#2c3e50'; // road
                else if (row === 7) fillColor = '#388e3c';   // safe grass
                else if (row === 8) fillColor = '#b8860b';   // goal

                ctx.fillStyle = fillColor;
                ctx.fillRect(0, y, canvas.width, CELL_H);

                // road lane markings
                if (row >= 2 && row <= 6) {
                    ctx.fillStyle = '#f1c40f';
                    const dashY = y + CELL_H * 0.5;
                    for (let col = 0; col < COLS; col++) {
                        const dashX = col * CELL_W + CELL_W * 0.25;
                        ctx.fillRect(dashX, dashY - 2, CELL_W * 0.5, 4);
                    }
                }

                // subtle grid lines
                ctx.strokeStyle = '#00000022';
                ctx.lineWidth = 1;
                for (let col = 0; col <= COLS; col++) {
                    ctx.beginPath();
                    ctx.moveTo(col * CELL_W, y);
                    ctx.lineTo(col * CELL_W, y + CELL_H);
                    ctx.stroke();
                }
            }

            // goal row checkered pattern + flag
            const goalY = canvas.height - (8 + 1) * CELL_H;
            for (let col = 0; col < COLS; col++) {
                ctx.fillStyle = (col % 2 === 0) ? '#f5e6b0' : '#d4af37';
                ctx.fillRect(col * CELL_W, goalY, CELL_W, CELL_H);
                ctx.font = `${CELL_H * 0.5}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#00000055';
                ctx.fillText('🏁', col * CELL_W + CELL_W / 2, goalY + CELL_H / 2 + 2);
                ctx.fillStyle = '#ffffffdd';
                ctx.fillText('🏁', col * CELL_W + CELL_W / 2, goalY + CELL_H / 2);
            }
        }

        // ---------- draw traffic ----------
        function drawCars() {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `${CELL_H * 0.8}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;

            cars.forEach(car => {
                const y = canvas.height - (car.row + 1) * CELL_H + CELL_H / 2;

                // Draw wrapped copies just outside the canvas too, so a car
                // gliding over an edge never pops in or out of existence.
                [-COLS, 0, COLS].forEach(shift => {
                    const x = (car.fCol + shift) * CELL_W + CELL_W / 2;
                    if (x < -CELL_W || x > canvas.width + CELL_W) return;

                    ctx.shadowColor = '#00000080';
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetY = 3;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(car.emoji, x, y);
                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetY = 0;
                });
            });
        }

        // ---------- draw a side-view cartoon black cat ----------
        function drawCat(now) {
            const x = cat.col * CELL_W + CELL_W / 2;
            const y = canvas.height - (cat.row + 1) * CELL_H + CELL_H / 2;

            // Soft halo keeps the black cat readable on the dark road.
            const glow = ctx.createRadialGradient(x, y - 3, 2, x, y - 3, 34);
            glow.addColorStop(0, 'rgba(255, 244, 190, 0.32)');
            glow.addColorStop(1, 'rgba(255, 244, 190, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(x, y - 3, 34, 0, Math.PI * 2);
            ctx.fill();

            // Ground shadow (stays put while the cat hops).
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.34)';
            ctx.beginPath();
            ctx.ellipse(x, y + 17, 20, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            let hop = 0;
            const hopElapsed = (now - cat.hopStart) / 190;
            if (hopElapsed >= 0 && hopElapsed < 1) {
                hop = Math.sin(hopElapsed * Math.PI) * 7;
            }
            const bob = Math.sin(now / 420) * 0.8;

            ctx.save();
            ctx.translate(x, y + 2 - hop + bob);
            ctx.scale(cat.facing * 0.8, 0.8);

            const ink = '#16161c';
            const inkLight = '#2a2a34';
            const outline = '#55505f';
            const cream = '#fff3da';
            const pink = '#ff9eb5';

            // ---- tail ----
            ctx.lineCap = 'round';
            ctx.strokeStyle = outline;
            ctx.lineWidth = 9;
            ctx.beginPath();
            ctx.moveTo(-13, 2);
            ctx.bezierCurveTo(-29, 4, -31, -14, -19, -16);
            ctx.stroke();

            ctx.strokeStyle = ink;
            ctx.lineWidth = 6.5;
            ctx.beginPath();
            ctx.moveTo(-13, 2);
            ctx.bezierCurveTo(-29, 4, -31, -14, -19, -16);
            ctx.stroke();

            // Tail tip highlight
            ctx.strokeStyle = '#3b3b48';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(-25, -7);
            ctx.bezierCurveTo(-28, -12, -24, -15, -19, -16);
            ctx.stroke();

            // ---- back legs / paws ----
            ctx.strokeStyle = ink;
            ctx.lineWidth = 7;
            ctx.beginPath();
            ctx.moveTo(-9, 4);
            ctx.quadraticCurveTo(-12, 10, -10, 15);
            ctx.stroke();

            ctx.strokeStyle = '#22222b';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(6, 5);
            ctx.quadraticCurveTo(7, 11, 9, 15);
            ctx.stroke();

            // paws
            ctx.fillStyle = outline;
            ctx.beginPath();
            ctx.ellipse(-10, 16, 5.2, 2.8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(9, 16, 5.2, 2.8, 0, 0, Math.PI * 2);
            ctx.fill();

            // ---- body ----
            ctx.shadowColor = 'rgba(255, 236, 150, 0.23)';
            ctx.shadowBlur = 8;
            ctx.fillStyle = ink;
            ctx.strokeStyle = outline;
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.ellipse(-2, 1, 16, 12.5, -0.08, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;

            // little shoulder highlight
            ctx.strokeStyle = inkLight;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-12, -6);
            ctx.quadraticCurveTo(-5, -11, 2, -8);
            ctx.stroke();

            // ---- cream chest patch ----
            ctx.fillStyle = cream;
            ctx.beginPath();
            ctx.ellipse(4, 4, 6.8, 8.2, -0.2, 0, Math.PI * 2);
            ctx.fill();

            // tiny chest fluff
            ctx.fillStyle = '#fffaf0';
            ctx.beginPath();
            ctx.arc(2, 7, 2.1, 0, Math.PI * 2);
            ctx.arc(5.5, 8.5, 1.8, 0, Math.PI * 2);
            ctx.fill();

            // ---- collar + bell ----
            ctx.save();
            ctx.translate(4.5, -4.5);
            ctx.rotate(0.28);
            ctx.fillStyle = '#e65353';
            ctx.strokeStyle = '#b63232';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(-8, -1.8, 15, 4.4, 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();

            ctx.fillStyle = '#ffd95c';
            ctx.strokeStyle = '#b88a16';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(9.5, -1, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#fff0a8';
            ctx.beginPath();
            ctx.arc(8.6, -2, 0.9, 0, Math.PI * 2);
            ctx.fill();

            // ---- ears (behind the head) ----
            ctx.fillStyle = ink;
            ctx.strokeStyle = outline;
            ctx.lineWidth = 1.6;

            ctx.beginPath();
            ctx.moveTo(4, -19);
            ctx.lineTo(3.5, -30);
            ctx.lineTo(12.5, -23.5);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(16.5, -23);
            ctx.lineTo(22, -30.5);
            ctx.lineTo(24, -19.5);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // pink inner ears
            ctx.fillStyle = pink;
            ctx.beginPath();
            ctx.moveTo(6.5, -21.5);
            ctx.lineTo(6.1, -27);
            ctx.lineTo(10.8, -23.3);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(18.5, -23);
            ctx.lineTo(21.4, -27.2);
            ctx.lineTo(22.4, -21.4);
            ctx.closePath();
            ctx.fill();

            // ---- head ----
            ctx.shadowColor = 'rgba(255, 236, 150, 0.20)';
            ctx.shadowBlur = 7;
            ctx.fillStyle = ink;
            ctx.strokeStyle = outline;
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.arc(13, -14.5, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;

            // cheek highlight
            ctx.fillStyle = '#24242e';
            ctx.beginPath();
            ctx.arc(18.5, -11.5, 4.5, 0, Math.PI * 2);
            ctx.fill();

            // ---- eye ----
            ctx.fillStyle = cream;
            ctx.beginPath();
            ctx.ellipse(17, -16.5, 4.2, 4.8, 0.06, 0, Math.PI * 2);
            ctx.fill();

            // green iris
            ctx.fillStyle = '#a9d96e';
            ctx.beginPath();
            ctx.ellipse(17.4, -16.2, 2.8, 3.6, 0, 0, Math.PI * 2);
            ctx.fill();

            // pupil
            ctx.fillStyle = '#171b12';
            ctx.beginPath();
            ctx.ellipse(17.8, -16.2, 1.35, 3.1, 0, 0, Math.PI * 2);
            ctx.fill();

            // eye shine
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(16.5, -18, 1.25, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.beginPath();
            ctx.arc(18.5, -14.8, 0.65, 0, Math.PI * 2);
            ctx.fill();

            // tiny brow
            ctx.strokeStyle = '#3b3b48';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(14.5, -22);
            ctx.quadraticCurveTo(17.5, -23.3, 20.2, -21.8);
            ctx.stroke();

            // ---- muzzle ----
            ctx.fillStyle = '#2a2a34';
            ctx.beginPath();
            ctx.ellipse(19.5, -8.8, 5.3, 3.9, -0.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = pink;
            ctx.beginPath();
            ctx.moveTo(22.2, -9.8);
            ctx.lineTo(24.3, -8.4);
            ctx.lineTo(22.1, -7.4);
            ctx.closePath();
            ctx.fill();

            // smile
            ctx.strokeStyle = '#17171c';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(22.2, -7.3);
            ctx.quadraticCurveTo(21, -5.4, 18.8, -6.4);
            ctx.stroke();

            // whiskers
            ctx.strokeStyle = 'rgba(255, 248, 230, 0.9)';
            ctx.lineWidth = 0.9;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(20.5, -9);
            ctx.lineTo(29.5, -11.4);
            ctx.moveTo(20.7, -8);
            ctx.lineTo(30, -7.8);
            ctx.moveTo(20.4, -7.1);
            ctx.lineTo(28.8, -4.4);
            ctx.stroke();

            // ---- front leg / paw ----
            ctx.strokeStyle = ink;
            ctx.lineWidth = 6.5;
            ctx.beginPath();
            ctx.moveTo(9, 6);
            ctx.quadraticCurveTo(11, 11, 13, 15);
            ctx.stroke();

            ctx.fillStyle = cream;
            ctx.beginPath();
            ctx.ellipse(13.6, 15.5, 4.8, 2.7, 0, 0, Math.PI * 2);
            ctx.fill();

            // toe line
            ctx.strokeStyle = '#d9c9a8';
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            ctx.moveTo(14.2, 14.1);
            ctx.lineTo(14.2, 16.8);
            ctx.stroke();

            // rear paw cream tip
            ctx.fillStyle = cream;
            ctx.beginPath();
            ctx.ellipse(-10, 15.7, 4.4, 2.4, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // ---------- draw everything ----------
        function draw(now) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            drawCars();
            drawCat(now);
        }

        // ---------- game loop ----------
        function gameLoop(now) {
            if (!lastFrameTime) lastFrameTime = now;
            // Normalise to 60 fps and cap long tab-switch pauses.
            const dt = Math.min(3, Math.max(0.15, (now - lastFrameTime) / (1000 / 60)));
            lastFrameTime = now;

            updateCars(dt);
            checkCollisionAfterMove(now);
            draw(now);
            requestAnimationFrame(gameLoop);
        }

        // ---------- keyboard ----------
        function handleKey(e) {
            const key = e.key;
            if (key.startsWith('Arrow')) e.preventDefault();

            if (key === 'ArrowUp') moveCat('up');
            else if (key === 'ArrowDown') moveCat('down');
            else if (key === 'ArrowLeft') moveCat('left');
            else if (key === 'ArrowRight') moveCat('right');
        }

        // ---------- touch swipe (simple) ----------
        let touchStartX = 0;
        let touchStartY = 0;
        let touchMoved = false;

        function handleTouchStart(e) {
            e.preventDefault();
            Sound.unlock();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchMoved = false;
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (touchMoved) return;
            if (e.touches.length === 0) return;
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            if (Math.max(absDx, absDy) < 18) return;

            touchMoved = true;
            if (absDx > absDy) {
                if (dx > 0) moveCat('right');
                else moveCat('left');
            } else {
                if (dy > 0) moveCat('down');
                else moveCat('up');
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            touchMoved = false;
        }

        // ---------- restart button ----------
        document.getElementById('restartButton').addEventListener('click', () => {
            Sound.unlock();
            Sound.click();
            resetGame();
            draw(performance.now());
        });

        // ---------- sound toggle ----------
        soundButton.addEventListener('click', () => {
            Sound.unlock();
            const nextEnabled = !Sound.isEnabled();
            Sound.setEnabled(nextEnabled);
            soundButton.textContent = nextEnabled ? '🔊' : '🔇';
            soundButton.setAttribute('aria-label', nextEnabled ? 'Mute sound' : 'Enable sound');
            if (nextEnabled) Sound.click();
        });

        // ---------- attach listeners ----------
        window.addEventListener('keydown', handleKey);
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd);
        canvas.addEventListener('touchcancel', handleTouchEnd);

        // Browsers require a user gesture before audio can start.
        window.addEventListener('pointerdown', () => Sound.unlock(), { once: true });
        window.addEventListener('keydown', () => Sound.unlock(), { once: true });

        // ---------- init ----------
        resetGame();
        draw(performance.now());
        requestAnimationFrame(gameLoop);
    })();
</script>
</body>
</html>
